services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
  reporting:
    build: ./services/reporting
    environment:
      REPORTING_SERVICE_TOKEN: ${REPORTING_SERVICE_TOKEN:?Set REPORTING_SERVICE_TOKEN in .env}
    networks: [default]
  migrate:
    build: ./apps/api
    command: ["node","scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://fieldops:${DB_PASSWORD}@postgres:5432/fieldops
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://fieldops:${DB_PASSWORD}@postgres:5432/fieldops
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REPORTING_SERVICE_TOKEN: ${REPORTING_SERVICE_TOKEN}
      REPORTING_URL: http://reporting:5100
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      reporting:
        condition: service_started
volumes:
  postgres_data:
